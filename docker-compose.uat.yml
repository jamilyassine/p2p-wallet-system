services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://vaultledger-uat.duckdns.org
    restart: unless-stopped
    ports:
      - "3000:3000"


